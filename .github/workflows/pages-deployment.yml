name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check production auth and database configuration
        id: cloudflare-config
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ORCL_SERVICE_ORIGIN: ${{ vars.ORCL_SERVICE_ORIGIN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_PAGES_API_TOKEN" || -z "$CLOUDFLARE_D1_API_TOKEN" || -z "$CLOUDFLARE_D1_DATABASE_ID" || -z "$GOOGLE_CLIENT_ID" || -z "$ORCL_SERVICE_ORIGIN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python - <<'PY'
          import ipaddress
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          value = os.environ["ORCL_SERVICE_ORIGIN"]
          try:
              parsed = urlsplit(value)
              hostname = parsed.hostname or ""
              port = parsed.port
          except ValueError:
              sys.exit(1)
          try:
              ipaddress.ip_address(hostname)
              is_ip = True
          except ValueError:
              is_ip = bool(re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,3}", hostname))
          labels = hostname.split(".")
          valid_hostname = len(labels) >= 2 and all(
              re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?", label)
              for label in labels
          )
          valid = (
              parsed.scheme == "https"
              and valid_hostname
              and not is_ip
              and port in (None, 443)
              and parsed.username is None
              and parsed.password is None
              and parsed.path in ("", "/")
              and not parsed.query
              and not parsed.fragment
          )
          sys.exit(0 if valid else 1)
          PY
          then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Wrangler runtime configuration
        if: ${{ steps.cloudflare-config.outputs.configured == 'true' }}
        env:
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ORCL_SERVICE_ORIGIN: ${{ vars.ORCL_SERVICE_ORIGIN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          config = Path("wrangler.template.toml").read_text(encoding="utf-8")
          config = config.replace("__CLOUDFLARE_D1_DATABASE_ID__", os.environ["D1_DATABASE_ID"])
          config = config.replace("__GOOGLE_CLIENT_ID__", os.environ["GOOGLE_CLIENT_ID"])
          config = config.replace("__ORCL_SERVICE_ORIGIN__", os.environ["ORCL_SERVICE_ORIGIN"])
          Path("wrangler.toml").write_text(config, encoding="utf-8")
          PY

      - name: Apply D1 migrations
        if: ${{ steps.cloudflare-config.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply dcr-vault --remote --config wrangler.toml

      - name: Deploy Cloudflare Pages
        if: ${{ steps.cloudflare-config.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dcr-vault --branch=main

      - name: Report skipped deployment
        if: ${{ steps.cloudflare-config.outputs.configured != 'true' }}
        shell: bash
        run: |
          echo "::warning::Google OAuth, Cloudflare D1, or a valid HTTPS ORCL_SERVICE_ORIGIN hostname is missing; the production deployment was skipped."
          {
            echo "## Cloudflare Pages deployment skipped"
            echo "Configure GOOGLE_CLIENT_ID, CLOUDFLARE_D1_DATABASE_ID, and ORCL_SERVICE_ORIGIN repository variables, plus CLOUDFLARE_D1_API_TOKEN, before production deployment. ORCL_SERVICE_ORIGIN must be an HTTPS hostname, not an IP address."
          } >> "$GITHUB_STEP_SUMMARY"
