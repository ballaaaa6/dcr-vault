name: Delete expired identification logs
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare database configuration
        env:
          DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$DATABASE_ID"
          python -c 'import os; from pathlib import Path; p=Path("wrangler.template.toml"); Path("wrangler.toml").write_text(p.read_text().replace("__CLOUDFLARE_D1_DATABASE_ID__", os.environ["DATABASE_ID"]))'
      - name: Delete expired rows
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute dcr-vault --remote --config wrangler.toml --command "DELETE FROM identification_logs WHERE expires_at <= unixepoch()"
